<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KEM Endpoint Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M8 10h16v10H8z' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M12 24h8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="brand big"><span class="logo"></span><div><b>KEM</b><small>Endpoint Manager</small></div></div>
      <label><span data-i18n="login.username">Username</span><input name="username" autocomplete="username" required value="admin"></label>
      <label><span data-i18n="login.password">Password</span><input name="password" type="password" autocomplete="current-password" required autofocus></label>
      <p class="err" id="login-err"></p>
      <button class="btn primary wide" type="submit" data-i18n="login.signin">Sign in</button>
      <div class="langsw login-lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="he">עברית</button></div>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <aside class="side">
      <div class="brand"><span class="logo"></span><div><b>KEM</b><small>Endpoint Manager</small></div></div>
      <nav>
        <a href="#/devices" data-nav="devices"><i>▣</i><span data-i18n="nav.devices">Devices</span></a>
        <a href="#/activity" data-nav="activity"><i>≡</i><span data-i18n="nav.activity">Activity</span></a>
        <a href="#/incidents" data-nav="incidents" data-cap="view_incidents"><i>⚠</i><span data-i18n="nav.incidents">Incidents</span><span class="navbadge hidden" id="inc-badge"></span></a>
        <a href="#/org" data-nav="org" data-cap="manage_org"><i>▤</i><span data-i18n="nav.org">Organization</span></a>
        <a href="#/gateways" data-nav="gateways" data-cap="manage_gateways"><i>⇄</i><span data-i18n="nav.gateways">Gateways</span></a>
        <a href="#/users" data-nav="users" data-cap="manage_users"><i>☻</i><span data-i18n="nav.users">Users</span></a>
        <a href="#/licensing" data-nav="licensing" data-cap="view_licensing"><i>©</i><span data-i18n="nav.licensing">Licensing</span></a>
        <a href="#/reports" data-nav="reports" data-cap="view_reports"><i>▦</i><span data-i18n="nav.reports">Reports</span></a>
        <a href="#/images" data-nav="images" data-cap="view_images"><i>⊙</i><span data-i18n="nav.images">Images</span></a>
        <a href="#/enroll" data-nav="enroll" data-cap="manage_tokens"><i>＋</i><span data-i18n="nav.enroll">Add devices</span></a>
        <a href="#/audit" data-nav="audit" data-cap="view_audit"><i>◷</i><span data-i18n="nav.audit">Audit log</span></a>
        <a href="#/settings" data-nav="settings"><i>⚙</i><span data-i18n="nav.settings">Settings</span></a>
      </nav>
      <div class="side-foot"><span id="me"></span>
        <div class="langsw"><button type="button" data-lang="en">EN</button><button type="button" data-lang="he">עברית</button></div>
        <button class="link" id="logout" data-i18n="sidebar.signout">Sign out</button></div>
    </aside>
    <main id="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="/static/app.js"></script>
</body>
</html>
